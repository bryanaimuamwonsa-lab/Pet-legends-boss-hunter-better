ate(-50%,-50%);opacity:0;background:#06152bf2;border:1px solid #7ef9ff66;border-radius:11px;padding:12px 15px;text-align:center;font-size:12px;font-weight:800;max-width:85vw;transition:opacity .2s}.toast.show{opacity:1}.modal{display:none;position:fixed;inset:0;z-index:5;align-items:center;justify-content:center;padding:12px;background:#020814c9;backdrop-filter:blur(7px)}.modal.open{display:flex}.dialog{width:min(660px,100%);max-height:90vh;overflow:auto;padding:17px}.dialog h1{margin:0;color:var(--c);font-size:22px}.dialog p{font-size:12px;line-height:1.5;color:#c2d5e9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}.card{padding:10px;border-radius:11px;border:1px solid #fff3;background:#142c48;cursor:pointer;min-height:92px}.card.selected{border:2px solid var(--g)}.card .big{font-size:25px}.card b{display:block;font-size:11px;margin:4px 0}.card small{font-size:9px;color:#afc6de}.dungeon{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid #fff2;background:#10243c;border-radius:10px;margin:7px 0}.dungeon .symbol{font-size:25px}.dungeon div:nth-child(2){flex:1}.dungeon b{font-size:11px}.dungeon small{display:block;color:#b2c8df;font-size:9px;margin-top:3px}.dungeon button{font-size:9px;padding:8px}.hint{font-size:10px;color:#9bb8d4}@media(max-width:550px){.team{width:135px;padding:6px}.mapbox{width:103px;padding:6px}.map{height:62px}.pet{gap:4px;padding:4px 0}.objective{top:62px}.logo b{font-size:11px}.stats{padding:8px;font-size:10px}.skill{width:39px;height:45px}.attack{width:47px;height:47px}.move{transform:scale(.84);transform-origin:left bottom}.bossbar{top:183px}}

<div class="top"><div class="logo panel"><b>PET LEGENDS 3D</b><small>RIFT CHAMPIONS • ORIGINAL CREATURES</small></div><div class="stats panel">LV <strong id="level">8</strong> · ₦<strong id="money">2500</strong> · ✦<strong id="gems">12</strong></div></div>

<script>
const $=x=>document.getElementById(x);
const pets=[
{name:'Cindercub',type:'Flame',e:'🦊',c:0xff7652,a:0xffdc7d,p:14},{name:'Mossback',type:'Nature',e:'🐢',c:0x45bd84,a:0xb7f58a,p:13},{name:'Voltkit',type:'Storm',e:'🐈',c:0x5bd9ff,a:0xfff16e,p:16},{name:'Tidefin',type:'Water',e:'🐬',c:0x4389ff,a:0x9effff,p:12},{name:'Pebblhorn',type:'Earth',e:'🦏',c:0xb89570,a:0xffe2a4,p:17},{name:'Lunamoth',type:'Mystic',e:'🦋',c:0xb393ff,a:0xffc9fb,p:14},{name:'Frostfang',type:'Ice',e:'🐺',c:0x8beaff,a:0xffffff,p:18},{name:'Glimmerfin',type:'Light',e:'🐟',c:0xffd85e,a:0xffffff,p:11},{name:'Riftwing',type:'Void',e:'🐉',c:0x9363e9,a:0xff80d0,p:21},{name:'Ironmane',type:'Metal',e:'🦁',c:0x8da6c2,a:0xe9f5ff,p:20},{name:'Bloomhare',type:'Nature',e:'🐇',c:0x8fe37a,a:0xffb9d9,p:13},{name:'Duskdrake',type:'Shadow',e:'🐲',c:0x514a9d,a:0xd6a6ff,p:19}];
const dungeons=[
{name:'Whispering Grove',icon:'🌿',desc:'Twisting roots, venom vines and ancient magic.',boss:'Thornmaw • Grove Colossus',level:5,hp:320,reward:900,c:0x54d99a},
{name:'Emberfall Crater',icon:'🌋',desc:'Lava rivers, falling ash and a furious tyrant.',boss:'Ashgor • Cinder Tyrant',level:10,hp:610,reward:1600,c:0xff7652},
{name:'Stormglass Citadel',icon:'⚡',desc:'Floating ruins lashed by lightning storms.',boss:'Tempestrix • Storm Sovereign',level:18,hp:1050,reward:2800,c:0x65dfff},
{name:'Abyssal Archive',icon:'🌌',desc:'A rift dungeon that bends light and gravity.',boss:'Null King • Devourer of Stars',level:28,hp:1750,reward:5000,c:0xb28bff}];
const S={money:2500,gems:12,level:8,x:0,z:0,mode:'explore',owned:pets.map((_,i)=>i),team:[0],dungeon:0,bossHP:0,bossMax:1,playerHP:100,keys:{},move:null,cool:{},t:0,teamHP:{}};
let scene,camera,renderer,clock,player,petGroups=[],boss,gate;
function mat(c,r=.6,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
function ball(g,c,pos,scale,seg=20){let o=new THREE.Mesh(new THREE.SphereGeometry(1,seg,seg),mat(c));o.position.set(...pos);o.scale.set(...scale);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
function stick(g,c,a,b,r=.12,r2=.025){let A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),v=B.clone().sub(A);let o=new THREE.Mesh(new THREE.CylinderGeometry(r2,r,v.length(),10),mat(c));o.position.copy(A.add(B).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());o.castShadow=true;g.add(o);return o}
function creature(c,a,stage=0,large=false,bigboss=false){let g=new THREE.Group();if(large)g.scale.setScalar(1.9);ball(g,c,[0,.83,0],[.65,.5,.76]);ball(g,c,[0,1.42,.36],[.48,.45,.47]);ball(g,a,[-.18,1.48,.76],[.11,.12,.05],12);ball(g,a,[.18,1.48,.76],[.11,.12,.05],12);ball(g,0x10233b,[-.18,1.48,.8],[.045,.07,.025],12);ball(g,0x10233b,[.18,1.48,.8],[.045,.07,.025],12);ball(g,0xfafcff,[0,1.26,.81],[.15,.06,.04],12);
for(let i=0;i<4;i++){let x=i<2?-.4:.4,z=i%2?-.4:.4;stick(g,c,[x,.67,z],[x*1.12,.12,z*1.1],.16,.1);ball(g,a,[x*1.12,.12,z*1.1],[.17,.09,.18],12)}
stick(g,a,[-.28,1.7,.2],[-.45,2.08,.14],.13,.018);stick(g,a,[.28,1.7,.2],[.45,2.08,.14],.13,.018);
for(let i=0;i<3+stage;i++){let x=(i-(2+stage)/2)*.17;stick(g,a,[x,1.72,-.12],[x,1.96+(i%2)*.12,-.25],.1,.015)}
stick(g,c,[0,.8,-.55],[.1,1.02,-1.05],.19,.11);ball(g,a,[.1,1.03,-1.08],[.17,.16,.18],12);
if(stage>=2)for(let side of [-1,1]){let w=ball(g,a,[side*.63,1.14,-.04],[.45,.09,.32]);w.rotation.z=side*.4}
if(stage>=5){let aura=new THREE.Mesh(new THREE.TorusGeometry(1.08,.035,8,32),new THREE.MeshBasicMaterial({color:a,transparent:true,opacity:.7}));aura.rotation.x=Math.PI/2;aura.position.y=1;g.add(aura)}
if(bigboss)for(let side of [-1,1]){stick(g,a,[side*.36,1.72,.1],[side*.65,2.55,.08],.2,.02);ball(g,a,[side*.65,2.55,.08],[.17,.2,.17],12)}return g}
function tree(x,z,s=1){let g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.15*s,.24*s,1.3*s,8),mat(0x6d4936));t.position.y=.65*s;g.add(t);for(let i=0;i<3;i++){let q=new THREE.Mesh(new THREE.IcosahedronGeometry((.68-i*.1)*s,1),mat([0x1c8d6b,0x277b61,0x329b75][i]));q.position.y=(1.35+i*.38)*s;q.castShadow=true;g.add(q)}g.position.set(x,0,z);scene.add(g)}
function crystal(x,z,c,s=1){let g=new THREE.Group(),m=new THREE.Mesh(new THREE.OctahedronGeometry(.6*s),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.28,metalness:.2,roughness:.25}));m.scale.y=1.7;m.position.y=.7*s;m.castShadow=true;g.add(m);g.position.set(x,0,z);scene.add(g)}
function world(){let geo=new THREE.PlaneGeometry(220,220,45,45);geo.rotateX(-Math.PI/2);let p=geo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,Math.sin(p.getX(i)*.12)*.17+Math.cos(p.getZ(i)*.13)*.15);geo.computeVertexNormals();let ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x286052,roughness:1}));ground.receiveShadow=true;scene.add(ground);let path=new THREE.Mesh(new THREE.PlaneGeometry(10,110),mat(0x66756d));path.rotation.x=-Math.PI/2;path.position.set(0,.025,-38);scene.add(path);
for(let i=0;i<28;i++){let x=(Math.random()-.5)*92,z=(Math.random()-.5)*115;if(Math.abs(x)<8&&z>-65&&z<12)continue;tree(x,z,.6+Math.random()*.85)}for(let i=0;i<22;i++)crystal((Math.random()-.5)*76,-15-Math.random()*80,[0x65efff,0xa17bff,0x72ffb7][i%3],.5+Math.random()*.6);
let ring=new THREE.Mesh(new THREE.TorusGeometry(5.4,.14,10,64),new THREE.MeshStandardMaterial({color:0x7ef9ff,emissive:0x168fb1,emissiveIntensity:.8,metalness:.4}));ring.rotation.x=Math.PI/2;ring.position.set(0,.12,-76);scene.add(ring);
gate=new THREE.Group();let pl=new THREE.Mesh(new THREE.CylinderGeometry(4.8,5.3,.3,32),mat(0x273e5c));pl.position.y=.15;gate.add(pl);for(let side of [-1,1]){let col=new THREE.Mesh(new THREE.BoxGeometry(.65,5,.65),mat(0x6c88a5,.25,.4));col.position.set(side*2.4,2.6,0);col.castShadow=true;gate.add(col);for(let i=0;i<3;i++){let gem=new THREE.Mesh(new THREE.OctahedronGeometry(.2),new THREE.MeshStandardMaterial({color:0x72faff,emissive:0x159ecb,emissiveIntensity:1}));gem.position.set(side*2.4,1+i*1.25,.4);gate.add(gem)}}let arch=new THREE.Mesh(new THREE.TorusGeometry(2.35,.22,10,48,Math.PI),new THREE.MeshStandardMaterial({color:0x7ef9ff,emissive:0x168db5,emissiveIntensity:.9,metalness:.4}));arch.position.y=4.6;arch.rotation.z=Math.PI;gate.add(arch);let portal=new THREE.Mesh(new THREE.CircleGeometry(2.15,40),new THREE.MeshBasicMaterial({color:0x3b75ff,transparent:true,opacity:.65,side:THREE.DoubleSide}));portal.position.set(0,2.6,-.1);gate.add(portal);gate.position.set(0,0,-76);scene.add(gate)}
function buildPets(){petGroups.forEach(p=>scene.remove(p));petGroups=[];S.team.forEach((id,i)=>{let p=pets[id],g=creature(p.c,p.a,Math.floor((S.level-1)/5));g.position.set(0,0,1.5+i*.5);scene.add(g);petGroups.push(g)})}
function buildBoss(){if(boss)scene.remove(boss);let d=dungeons[S.dungeon];boss=creature(d.c,0xffd99b,5,true,true);boss.position.set(0,0,-8);boss.visible=S.mode==='battle';scene.add(boss)}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x9bcbd7);scene.fog=new THREE.Fog(0x9bcbd7,38,150);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;$('world').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xc8f5ff,0x2c5143,2));let sun=new THREE.DirectionalLight(0xfff1d7,3);sun.position.set(-25,35,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);let glow=new THREE.PointLight(0x54bfff,40,60);glow.position.set(0,9,-76);scene.add(glow);world();player=new THREE.Group();ball(player,0x286fca,[0,1.05,0],[.4,.62,.31]);ball(player,0xf0c49d,[0,1.86,.05],[.33,.36,.31]);ball(player,0x1b2943,[0,2.12,-.02],[.37,.19,.34]);ball(player,0x73f6ff,[0,1.79,.33],[.075,.05,.025],12);stick(player,0x24456e,[-.23,.82,0],[-.28,.2,.04],.13,.09);stick(player,0x24456e,[.23,.82,0],[.28,.2,.04],.13,.09);stick(player,0x286fca,[-.36,1.3,0],[-.6,.88,.12],.12,.09);stick(player,0x286fca,[.36,1.3,0],[.6,.88,.12],.12,.09);scene.add(player);buildPets();buildBoss();clock=new THREE.Clock();window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});window.addEventListener('keyup',e=>S.keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('touchstart',e=>{e.preventDefault();S.move=b.dataset.dir},{passive:false});b.addEventListener('touchend',()=>S.move=null);b.addEventListener('mousedown',()=>S.move=b.dataset.dir);b.addEventListener('mouseup',()=>S.move=null);b.addEventListener('mouseleave',()=>S.move=null)});renderTeam();update();loop()}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);S.t+=dt;if(S.mode==='explore'){let f=0,x=0,k=S.keys;if(k.w||k.arrowup||S.move==='up')f=-1;if(k.s||k.arrowdown||S.move==='down')f=1;if(k.a||k.arrowleft||S.move==='left')x=-1;if(k.d||k.arrowright||S.move==='right')x=1;let l=Math.hypot(f,x)||1;S.x=Math.max(-43,Math.min(43,S.x+x/l*dt*8));S.z=Math.max(-73,Math.min(20,S.z+f/l*dt*8));player.position.set(S.x,Math.sin(S.t*6)*.025,S.z);if(f||x)player.rotation.y=Math.atan2(x,-f);petGroups.forEach((p,i)=>{let a=S.t*1.7+i*2.1;p.position.set(S.x+Math.sin(a)*1.5,.05+Math.sin(S.t*3+i)*.08,S.z+1.7+Math.cos(a)*1.1);p.rotation.y=Math.sin(a)*.3});let dist=Math.hypot(S.x,S.z+76);camera.position.lerp(new THREE.Vector3(S.x,8.5,S.z+13),.075);camera.lookAt(S.x,1.2,S.z-4);$('distance').textContent='Gate: '+Math.round(dist*4)+'m';$('objtitle').textContent=dist<9?'DUNGEON GATE NEARBY':'EXPLORE THE WILDS';$('objtext').textContent=dist<9?'Open DUNGEONS to choose your challenge':'Travel north to the glowing gate'}else{camera.position.lerp(new THREE.Vector3(S.x+8,8,S.z+12),.04);camera.lookAt(S.x,1.2,S.z-5);if(boss){boss.rotation.y+=dt*.2;boss.position.y=Math.sin(S.t*2)*.08}petGroups.forEach((p,i)=>{p.position.set(S.x+(i-2)*1.15+Math.sin(S.t*2+i)*.2,.04,S.z-2-Math.cos(S.t+i)*.4);p.rotation.y=Math.sin(S.t+i)*.5})}if(gate)gate.children.forEach((o,i)=>{if(o.material&&o.material.emissive)o.material.emissiveIntensity=.5+Math.sin(S.t*2+i)*.35});renderer.render(scene,camera)}
function update(){$('level').textContent=S.level;$('money').textContent=S.money.toLocaleString('en-NG');$('gems').textContent=S.gems;$('count').textContent=S.team.length+'/5'}
function renderTeam(){$('teamlist').innerHTML=S.team.map(id=>{let p=pets[id],hp=S.teamHP[id]??100;return `<div class="pet"><div class="emoji">${p.e}</div><div style="flex:1"><b>${p.name}</b><small>${p.type} · Power ${p.p+Math.floor(S.level/3)}</small><div class="hp"><i style="width:${hp}%"></i></div></div></div>`}).join('')}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.tm);toast.tm=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function show(content){$('dialog').innerHTML=content;$('modal').classList.add('open')}function close(){$('modal').classList.remove('open')}
function openDungeons(){if(S.mode==='explore'&&Math.hypot(S.x,S.z+76)>9){toast('Travel north to the glowing gate first!');return}let h='<h1>Dungeon Expeditions</h1><p>Travel to the distant gate in the wilds. Inside, bosses have heavy attacks and huge health pools. Bring up to five companions. Higher dungeons need higher player levels.</p>';dungeons.forEach((d,i)=>{let locked=S.level<d.level;h+=`<div class="dungeon"><div class="symbol">${d.icon}</div><div><b>${d.name}</b><small>${d.desc}</small><small>Recommended level ${d.level} · ${d.boss}</small></div><button class="btn ${locked?'secondary':''}" ${locked?'disabled':''} onclick="enter(${i})">${locked?'LOCKED':'ENTER'}</button></div>`});h+='<button class="btn secondary" onclick="close()">BACK TO WILDS</button>';show(h)}
function enter(i){S.dungeon=i;S.mode='battle';S.bossMax=dungeons[i].hp+Math.max(0,S.level-dungeons[i].level)*30;S.bossHP=S.bossMax;S.playerHP=100;S.x=0;S.z=0;player.position.set(0,0,0);buildBoss();boss.visible=true;$('bossbar').style.display='block';$('bossname').textContent=dungeons[i].boss;$('objtitle').textContent='DUNGEON BOSS';$('objtext').textContent='Use attacks and abilities. Bosses hit back!';updateBoss();close();toast('Dungeon entered. Stay alert!')}
function openTeam(){let h='<h1>Build Your Squad</h1><p>Choose up to five original creatures. Tap a card to add or remove it.</p><div class="cards">';S.owned.forEach(id=>{let p=pets[id],sel=S.team.includes(id);h+=`<div class="card ${sel?'selected':''}" onclick="toggle(${id})"><div class="big">${p.e}</div><b>${p.name}</b><small>${p.type} element · Power ${p.p}</small><small>${sel?'✓ IN SQUAD':'TAP TO ADD'}</small></div>`});h+='</div><button class="btn" onclick="close();buildPets();renderTeam();toast(\'Squad ready!\')">CONFIRM SQUAD</button> <button class="btn secondary" onclick="close()">CANCEL</button>';show(h)}
function toggle(id){if(S.team.includes(id)){if(S.team.length===1){toast('Keep at least one creature');return}S.team=S.team.filter(x=>x!==id)}else if(S.team.length<5)S.team.push(id);else{toast('Maximum squad size is five');return}openTeam()}
function updateBoss(){$('bossfill').style.width=Math.max(0,S.bossHP/S.bossMax*100)+'%';$('bossinfo').textContent=Math.max(0,Math.ceil(S.bossHP))+' / '+S.bossMax+' HP · Your HP: '+Math.max(0,S.playerHP)}
function attack(){if(S.mode!=='battle'){toast('Travel to the distant gate and enter a dungeon first');return}hitBoss(18+S.team.reduce((n,id)=>n+pets[id].p,0)*.7,'SQUAD ATTACK')}
function skill(n){if(S.mode!=='battle'){toast('Abilities are for dungeon battles');return}let cd={spark:2200,burst:6000,heal:8000,ultimate:14000}[n],now=Date.now();if(S.cool[n]&&now-S.cool[n]<cd){toast('Ability is recharging');return}S.cool[n]=now;if(n==='heal'){S.playerHP=Math.min(100,S.playerHP+35);S.team.forEach(id=>S.teamHP[id]=Math.min(100,(S.teamHP[id]??100)+25));renderTeam();updateBoss();toast('Healing pulse!');return}hitBoss(({spark:42,burst:72,ultimate:135}[n])+S.team.reduce((v,id)=>v+pets[id].p,0),n.toUpperCase())}
function hitBoss(amt,label){S.bossHP-=amt;toast(label+' · '+Math.round(amt)+' damage');if(S.bossHP<=0){win();return}let hurt=16+S.dungeon*9+Math.floor(Math.random()*17);S.playerHP-=hurt;S.team.forEach(id=>S.teamHP[id]=Math.max(5,(S.teamHP[id]??100)-hurt*.8));renderTeam();updateBoss();if(S.playerHP<=0){S.mode='explore';boss.visible=false;$('bossbar').style.display='none';buildPets();$('objtitle').textContent='SQUAD RETREATED';$('objtext').textContent='Train up and try again';toast('Defeat! The boss was too strong this time.')}}
function win(){let d=dungeons[S.dungeon];S.money+=d.reward;S.gems+=3;S.level=Math.min(50,S.level+2);S.mode='explore';boss.visible=false;$('bossbar').style.display='none';buildPets();renderTeam();update();$('objtitle').textContent='DUNGEON CLEARED';$('objtext').textContent='₦'+d.reward+' bounty · +3 gems · +2 levels';show(`<h1>VICTORY!</h1><p>Your squad defeated <b>${d.boss}</b>!</p><div class="cards"><div class="card"><div class="big">₦</div><b>₦${d.reward.toLocaleString('en-NG')}</b><small>Boss bounty</small></div><div class="card"><div class="big">✦</div><b>+3 Gems</b><small>Rare reward</small></div><div class="card"><div class="big">⬆</div><b>+2 Levels</b><small>Player growth</small></div></div><button class="btn" onclick="close();$('objtitle').textContent='EXPLORE THE WILDS';$('objtext').textContent='Travel to the next dungeon gate';toast('Back to the wilds!')">RETURN TO WILDS</button>`)}
window.openDungeons=openDungeons;window.openTeam=openTeam;window.enter=enter;window.toggle=toggle;window.close=close;window.attack=attack;window.skill=skill;init();
</script></body></html>
